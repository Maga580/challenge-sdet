name: Cypress CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  cypress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: api
            command: npm run test:api
          - suite: ui
            command: npm run test:ui
    env:
      BUGGY_BASE_URL: https://buggy.justtestit.org
      BUGGY_API_URL: https://k51qryqov3.execute-api.ap-southeast-2.amazonaws.com/prod
      PETSTORE_URL: https://petstore.swagger.io/v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cypress install
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-${{ matrix.suite }}-results
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: warn
          retention-days: 14
